name: Erzählerstimme erzeugen
# Kostenlos auf GitHub-Servern (öffentliches Repo): erzeugt mit Chatterbox (MIT, wie ElevenLabs, aber gratis) das Audio für die Geschichten.
# Manuell starten: Actions -> "Erzählerstimme erzeugen" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      geschichten:
        description: 'IDs mit Komma (z. B. nuh,musa) oder "alle"'
        default: 'alle'
      max_geschichten:
        description: 'Höchstens so viele Geschichten pro Lauf'
        default: '40'
      stimme:
        description: 'Stimme: A_ruhig, B_neutral oder C_langsam'
        default: 'A_ruhig'
permissions: { contents: write, actions: write }
concurrency: { group: audio, cancel-in-progress: false }
jobs:
  planen:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.m.outputs.matrix }}', anzahl: '${{ steps.m.outputs.anzahl }}' }
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, glob
          want = os.environ.get('W', 'alle')
          ids = []
          for f in sorted(glob.glob('src/data/geschichten/*.json')):
              if f.endswith('index.json'): continue
              g = json.load(open(f, encoding='utf-8'))
              if want != 'alle' and g['id'] not in [x.strip() for x in want.split(',')]: continue
              sa = [s['id'] for n, fa in g['fassungen'].items() if n != 'klassisch' for s in fa['saetze'] if not s.get('zitat_id')]
              mp = f"public/audio/{g['id']}/meta.json"
              have = set(json.load(open(mp, encoding='utf-8'))) if os.path.exists(mp) else set()
              if set(sa) - have: ids.append(g['id'])
          ids = ids[:int(os.environ.get('MAXG', '40'))]
          print('matrix=' + json.dumps({'id': ids}))
          print('anzahl=' + str(len(ids)))
          PY
        env: { W: '${{ inputs.geschichten }}', MAXG: '${{ inputs.max_geschichten }}' }
  erzeugen:
    needs: planen
    if: needs.planen.outputs.anzahl != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.planen.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: hf-chatterbox-v1 }
      - name: Abhängigkeiten
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper "setuptools<81"
      - name: Audio erzeugen
        run: python tools/tts/erzaehler.py "${{ matrix.id }}" --stimme "${{ inputs.stimme }}"
      - uses: actions/upload-artifact@v4
        with: { name: 'audio-${{ matrix.id }}', path: 'public/audio/${{ matrix.id }}', retention-days: 3 }
  einchecken:
    needs: erzeugen
    if: always() && needs.erzeugen.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'audio-*', path: artefakte }
        continue-on-error: true
      - name: Ins Repo übernehmen
        run: |
          shopt -s nullglob
          for d in artefakte/audio-*; do id="${d#artefakte/audio-}"; mkdir -p "public/audio/$id"; cp -r "$d"/. "public/audio/$id/"; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Erzählerstimme (KI) erzeugt: $(ls artefakte | sed 's/audio-//' | tr '\n' ' ')"
          git pull --rebase origin main && git push origin HEAD:main
          gh workflow run pages.yml --ref main
        env: { GH_TOKEN: '${{ github.token }}' }
